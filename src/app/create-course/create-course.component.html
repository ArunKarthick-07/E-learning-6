<div class="page-container">
  <div class="create-course-container">
    <h2>Create a New Course</h2>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name">Course Name:</label>
        <input
          type="text"
          id="name"
          [(ngModel)]="course.name"
          name="name"
          required
          placeholder="Enter course name"
        >
      </div>

      <div class="form-group">
        <label for="description">Description:</label>
        <textarea
          id="description"
          [(ngModel)]="course.description"
          name="description"
          required
          placeholder="Enter course description"
        ></textarea>
      </div>

      <div class="form-group">
        <label for="contents">Contents:</label>
        <textarea
          id="contents"
          [(ngModel)]="course.contents"
          name="contents"
          required
          placeholder="Enter course contents"
        ></textarea>
      </div>

      <div class="form-group">
        <label for="price">Price:</label>
        <input
          type="number"
          id="price"
          [(ngModel)]="course.price"
          name="price"
          required
          min="0"
          step="0.01"
          placeholder="Enter course price"
        >
      </div>

      <div class="form-group">
        <label for="thumbnail">Course Thumbnail:</label>
        <input
          type="file"
          id="thumbnail"
          (change)="onThumbnailChange($event)"
          accept="image/jpeg,image/png,image/jpg"
        >
        <small>Accepted formats: JPEG, PNG, JPG</small>
        <div *ngIf="thumbnailError" class="error">{{ thumbnailError }}</div>
      </div>

      <div class="form-group">
        <label for="pdfs">Upload PDFs:</label>
        <input
          type="file"
          id="pdfs"
          (change)="onFileChange($event)"
          multiple
          accept="application/pdf"
        >
        <small>Accepted format: PDF</small>
        <div *ngIf="pdfError" class="error">{{ pdfError }}</div>
      </div>

      <div class="form-group">
        <label>YouTube Links:</label>
        <div *ngFor="let link of youtubeLinks; let i = index; trackBy: trackByLink" class="youtube-link">
          <input
            type="url"
            [(ngModel)]="youtubeLinks[i]"
            [name]="'youtubeLink' + i"
            (ngModelChange)="onYoutubeLinkChange(i)"
            placeholder="Enter YouTube link"
          >
          <button
            type="button"
            (click)="removeYoutubeLink(i)"
            *ngIf="youtubeLinks.length > 1"
          >
            Remove
          </button>
        </div>
        <button type="button" (click)="addYoutubeLink()">Add YouTube Link</button>
        <div *ngIf="youtubeLinkError" class="error">{{ youtubeLinkError }}</div>
      </div>

      <div class="form-buttons">
        <button type="submit" [disabled]="isLoading">
          {{ isLoading ? 'Creating...' : 'Create Course' }}
        </button>
        <button type="button" (click)="goBack()" [disabled]="isLoading">Back to Instructor Page</button>
      </div>
    </form>
  </div>
</div>
