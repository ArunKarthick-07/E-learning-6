<div class="page-container">
  <div class="login-container">
    <h2>Instructor Login</h2>
    <div *ngIf="!showResetForm; else resetForm">
      <form (ngSubmit)="onSubmit(loginForm)" #loginForm="ngForm">
        <div class="form-group">
          <label for="username">Username:</label>
          <input
            type="text"
            id="username"
            name="username"
            [(ngModel)]="instructor.username"
            required
            placeholder="Enter your username"
            class="form-control"
          />
        </div>

        <div class="form-group">
          <label for="password">Password:</label>
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="instructor.password"
            required
            placeholder="Enter your password"
            class="form-control"
          />
        </div>

        <button type="submit" [disabled]="!loginForm.valid || isLoading" class="btn btn-primary">
          {{ isLoading ? 'Logging in...' : 'Login' }}
        </button>
      </form>

      <p class="forgot-password">
        Forgot your password? <a (click)="toggleResetForm()">Reset Password</a>
      </p>
    </div>

    <ng-template #resetForm>
      <form (ngSubmit)="onResetPassword(resetForm)" #resetForm="ngForm">
        <div class="form-group">
          <label for="resetUsername">Username:</label>
          <input
            type="text"
            id="resetUsername"
            name="resetUsername"
            [(ngModel)]="resetInstructor.username"
            required
            placeholder="Enter your username"
            class="form-control"
          />
        </div>

        <div class="form-group">
          <label for="newPassword">New Password:</label>
          <input
            type="password"
            id="newPassword"
            name="newPassword"
            [(ngModel)]="resetInstructor.newPassword"
            required
            placeholder="Enter your new password"
            class="form-control"
          />
        </div>

        <button type="submit" [disabled]="!resetForm.valid || isLoading" class="btn btn-primary">
          {{ isLoading ? 'Resetting...' : 'Reset Password' }}
        </button>
        <button type="button" (click)="toggleResetForm()" class="btn btn-secondary">Back to Login</button>
      </form>
    </ng-template>
  </div>
</div>
